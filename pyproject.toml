[project]
name = "citehop"
version = "1.0.0"
description = "Finds citations and reviews literature claims locally."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pymupdf>=1.24.0",
    "pylatexenc>=2.10",
    "PySide6>=6.6",
]

[project.scripts]
citehop = "citehop.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citehop = ["assets/*", "claims/templates/*.json"]

